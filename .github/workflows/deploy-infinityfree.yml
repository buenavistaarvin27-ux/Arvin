name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate database configuration
        env:
          DB_HOST: ${{ secrets.INFINITYFREE_DB_HOST }}
          DB_NAME: ${{ secrets.INFINITYFREE_DB_NAME }}
          DB_USERNAME: ${{ secrets.INFINITYFREE_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.INFINITYFREE_DB_PASSWORD }}
          FTP_SERVER: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          required = {
              "INFINITYFREE_DB_HOST": os.environ.get("DB_HOST", ""),
              "INFINITYFREE_DB_NAME": os.environ.get("DB_NAME", ""),
              "INFINITYFREE_DB_USERNAME": os.environ.get("DB_USERNAME", ""),
              "INFINITYFREE_DB_PASSWORD": os.environ.get("DB_PASSWORD", ""),
              "INFINITYFREE_FTP_SERVER": os.environ.get("FTP_SERVER", ""),
              "INFINITYFREE_FTP_USERNAME": os.environ.get("FTP_USERNAME", ""),
              "INFINITYFREE_FTP_PASSWORD": os.environ.get("FTP_PASSWORD", ""),
          }
          missing = [name for name, value in required.items() if not value]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))

          secrets = {
              "INFINITYFREE_DB_HOST": os.environ.get("DB_HOST", ""),
              "INFINITYFREE_DB_NAME": os.environ.get("DB_NAME", ""),
              "INFINITYFREE_DB_USERNAME": os.environ.get("DB_USERNAME", ""),
              "INFINITYFREE_DB_PASSWORD": os.environ.get("DB_PASSWORD", ""),
          }

          def php_string(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          config = """<?php

          $host = @@DB_HOST@@;
          $dbname = @@DB_NAME@@;
          $username = @@DB_USERNAME@@;
          $password = @@DB_PASSWORD@@;

          try {
              $pdo = new PDO(
                  "mysql:host=$host;dbname=$dbname;charset=utf8mb4",
                  $username,
                  $password
              );
              $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
              $pdo->setAttribute(PDO::ATTR_DEFAULT_FETCH_MODE, PDO::FETCH_ASSOC);
              $pdo->setAttribute(PDO::ATTR_EMULATE_PREPARES, false);
          } catch (PDOException $e) {
              error_log("Database connection failed: " . $e->getMessage());
              die("Database connection failed.");
          }
          """
          for name, value in secrets.items():
              config = config.replace("@@" + name.removeprefix("INFINITYFREE_") + "@@", php_string(value))

          Path("config").mkdir(parents=True, exist_ok=True)
          Path("config/database.php").write_text(config, encoding="utf-8")
          PY

      - name: Deploy files to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /htdocs/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/README.md
