name: Deploy to TinkerHost

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate database configuration
        env:
          DB_HOST: ${{ secrets.TINKERHOST_DB_HOST }}
          DB_NAME: ${{ secrets.TINKERHOST_DB_NAME }}
          DB_USERNAME: ${{ secrets.TINKERHOST_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.TINKERHOST_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          values = {
              "host": os.environ.get("DB_HOST", ""),
              "dbname": os.environ.get("DB_NAME", ""),
              "username": os.environ.get("DB_USERNAME", ""),
              "password": os.environ.get("DB_PASSWORD", ""),
          }
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit("Missing TinkerHost database secrets: " + ", ".join(missing))

          def php_string(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          config = f'''<?php
          $host = {php_string(values["host"])};
          $dbname = {php_string(values["dbname"])};
          $username = {php_string(values["username"])};
          $password = {php_string(values["password"])};
          try {{
              $pdo = new PDO(
                  "mysql:host=$host;dbname=$dbname;charset=utf8mb4",
                  $username,
                  $password,
                  [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                   PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                   PDO::ATTR_EMULATE_PREPARES => false]
              );
          }} catch (PDOException $e) {{
              error_log("Database connection failed: " . $e->getMessage());
              http_response_code(503);
              exit("The portfolio is temporarily unavailable.");
          }}
          ?>
          '''
          Path("config/database.php").write_text(config, encoding="utf-8")
          PY

      - name: Deploy files to TinkerHost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.TINKERHOST_FTP_SERVER }}
          username: ${{ secrets.TINKERHOST_FTP_USERNAME }}
          password: ${{ secrets.TINKERHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /htdocs/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/README.md
            **/database/**
